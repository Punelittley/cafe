name: Redis & Site Keep-Alive

on:
  schedule:
    # Запуск каждый понедельник и четверг в 09:00 UTC
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Saperavi Website
        run: |
          curl -sSf https://punelittley.github.io/cafe/ > /dev/null || true
          echo "Site ping completed successfully!"
